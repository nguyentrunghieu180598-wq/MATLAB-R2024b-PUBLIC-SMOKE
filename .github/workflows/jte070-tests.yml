name: JTE070 strict fine source and private MAT authorization tests
on:
  push:
    branches: ['chat/jte070-strict-fine-20261026']
    paths: ['jte070/TRIGGER_UNIT_TESTS.txt']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard and data transport safety regression only
        run: |
          cd jte-public
          python3 -m unittest -v test_JTE070_guards test_JTE063_streaming_drive
