name: JTE089 execution-method forensics R2024b
on:
  push:
    branches: ['codex/jte089-execution-forensics']
    paths: ['.github/workflows/jte089-execution-forensics.yml', 'jte-public/JTE089*.m']
permissions:
  contents: read
jobs:
  read-only-execution-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin vendor source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Read-only execution listeners and native state diagnostic
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE089_execution_probe
      - name: Remove derivative scratch without publishing research data
        if: always()
        run: rm -rf jte089-generated
