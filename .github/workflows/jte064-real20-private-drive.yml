name: JTE064 owner-approved real MATLAB 20s private Drive diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'jte064/TRIGGER_REAL20_ONCE.txt'
permissions:
  contents: read
jobs:
  jte064-real20:
    if: ${{ github.repository == 'nguyentrunghieu180598-wq/MATLAB-R2024b-PUBLIC-SMOKE' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'JTE064_RUN_ONCE_REAL_R2024B_DIAGNOSTIC20_TO_PRIVATE_DRIVE' }}
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clone pinned MathWorks vendor model and check SHA256
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: MATLAB duplicate event fixture and REAL 20-second C0 native logger
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE056_repair_20s
      - name: Upload ONLY real diagnostic MAT directly to private Drive
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: |
          test -s jte056-private/JTE056_NATIVE_LOGGER_REPAIR_20S.mat
          python3 jte-public/JTE064_real20_private_upload.py
      - name: Remove raw MAT and derivative copies from hosted runner
        if: always()
        run: |
          rm -rf jte056-private jte056-generated
      - name: Verify upstream vendor file unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
