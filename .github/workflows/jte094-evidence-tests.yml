name: JTE094 evidence semantics regression only
on:
  push:
    branches: ['codex/jte094-evidence-quantizer']
    paths: ['.github/workflows/jte094-evidence-tests.yml']
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE094_EVIDENCE_TESTS
