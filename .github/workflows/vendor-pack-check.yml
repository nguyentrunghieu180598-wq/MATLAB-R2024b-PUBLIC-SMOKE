name: Vendor MathWorks Battery Pack Compile Smoke (No JTE Data)

on:
  push:
    paths:
      - '.github/workflows/vendor-pack-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned public MathWorks source
        run: |
          git clone --branch 24.2.1.5 --depth 1 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -

      - name: Install MATLAB R2024b and public source dependencies
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Simulink
            Simscape
            Simscape_Electrical
            Simscape_Fluids
            Simscape_Battery
            Stateflow

      - name: Compile original public MathWorks model
        uses: matlab-actions/run-command@v3
        with:
          command: vendor_r2024b_preflight

      - name: Verify original source unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi

      - name: Save vendor-only evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-upstream-compile-evidence
          path: reports/
          retention-days: 3
          if-no-files-found: warn
