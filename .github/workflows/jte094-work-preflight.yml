name: JTE094 WORK independent software preflight
on:
  push:
    branches: ['codex/jte094-evidence-quantizer']
    paths: ['.github/workflows/jte094-work-preflight.yml']
permissions:
  contents: read
jobs:
  matlab-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE094_WORK_staticSuite

# Explicit rerun after repairing MATLAB assert identifier/message diagnostics.
