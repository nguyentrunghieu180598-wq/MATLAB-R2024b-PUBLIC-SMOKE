name: JTE043 actual controller and native logger audit
on:
  push:
    branches: ['codex/jte043-controller-native']
    paths: ['.github/workflows/jte043-native.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate pinned public reference
        run: |
          git clone --branch 24.2.1.5 --depth 1 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: New source and native logger diagnostic ONLY
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); ci_jte043_controller_native
      - name: Package public source and approved metadata ONLY
        run: |
          python3 - <<'PY'
          import pathlib,shutil,json,hashlib,os
          out=pathlib.Path('jte043-source-metadata');out.mkdir()
          names=['JTE043_law.m','JTE043_instrumentNative.m','JTE043_controllerTest.m','JTE043_nativeCapture.m','ci_jte043_controller_native.m']
          for name in names:shutil.copyfile(pathlib.Path('jte-public')/name,out/name)
          shutil.copyfile('jte043-safe-metadata/receipt.json',out/'receipt.json')
          rows=[{'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir())]
          (out/'manifest.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'scope':'source, dimensions and synthetic controller metadata only; NO research MAT/CSV/SLX or project keys','files':rows},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jte043-source-and-approved-metadata
          path: jte043-source-metadata/
          retention-days: 30
          if-no-files-found: error
      - name: Original integrity after diagnostic
        if: always()
        run: echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
# Revision 2: synthetic model workspace available before compiled inspection.
