name: JTE 2400s B0L C0 Solver Sensitivity (No Research Data Upload)

on:
  push:
    paths:
      - '.github/workflows/jte-2400s-solver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g5-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Clone immutable public MathWorks reference
        run: |
          git clone --branch 24.2.1.5 --depth 1 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Install MATLAB R2024b and Simscape toolchains
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Simulink
            Simscape
            Simscape_Battery
            Simscape_Electrical
            Simscape_Fluids
            Stateflow
      - name: Run 2400s coarse fine B0L C0; study data remains ephemeral
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); ci_jte_solver_gate
      - name: Verify pinned original was not modified
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
      # Intentionally no upload-artifact: raw study MAT/CSV remain private to disposable runner.
