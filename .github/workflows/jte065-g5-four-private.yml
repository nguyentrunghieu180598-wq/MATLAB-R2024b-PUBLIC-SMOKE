name: JTE065 four independent native 2400s G5 raw simulations to PRIVATE Drive
on:
  push:
    branches: [main]
    paths: ['jte065/TRIGGER_FOUR_2400_ONCE.txt']
permissions:
  contents: read
jobs:
  g5-native-acquisition:
    if: ${{ github.repository == 'nguyentrunghieu180598-wq/MATLAB-R2024b-PUBLIC-SMOKE' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'JTE065_AUTHORIZE_FOUR_INDEPENDENT_2400_CASES' }}
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: B0L
            profile: original
          - case: C0
            profile: original
          - case: B0L
            profile: fine
          - case: C0
            profile: fine
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin unchanged official MathWorks source SHA and model
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Run original physical MATLAB model 2400 seconds and native scientific checks
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE065_G5_case('${{ matrix.case }}','${{ matrix.profile }}')
      - name: Store only raw, unaccepted MAT in owner-only Drive with checksum readback
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE_CASE: ${{ matrix.case }}
          JTE_PROFILE: ${{ matrix.profile }}
        run: |
          python3 jte-public/JTE065_upload_raw_G5.py
      - name: Remove private MAT and derivative from public-runner scratch
        if: always()
        run: rm -rf jte065-private jte065-generated-*
      - name: Verify source file unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
