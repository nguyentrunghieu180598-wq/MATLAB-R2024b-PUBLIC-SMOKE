name: JTE060 pinned controller source-specific synthetic fixture
on:
  push:
    branches: ['chat/jte060-controller-source-check-20261025']
    paths: ['jte060/TRIGGER_SOURCE_FIXTURE.txt']
permissions:
  contents: read
jobs:
  controller-fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Clone source-pinned MathWorks model
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo "0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx" | sha256sum -c -
      - name: Synthetic selector and native-math regression
        run: |
          python3 -m pip install --quiet numpy
          cd jte-public
          python3 -m unittest -v test_JTE058_native_math test_JTE058_review test_JTE059_streaming test_JTE060_selector_oracle
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Synthetic stimuli through ACTUAL pinned FlwR_calc + downstream filter
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE060controllerEventFixture
      - name: Confirm pinned source unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo "0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx" | sha256sum -c -
          fi
