name: JTE086 targeted TransferFcn state error tolerance test
on:
  push:
    branches: ['chat/jte086-tf-state-abstol-20261026']
    paths: ['jte086/TRIGGER_TF_ABSTOL.txt']
permissions:
  contents: read
jobs:
  tf-state-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check frozen original MathWorks source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Original solver 340s with exactly one TF local tolerance correction
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE086_tf_state_accuracy_340
      - name: Remove generated derivative and confidential numerical data
        if: always()
        run: rm -rf jte086-generated* jte086-private*