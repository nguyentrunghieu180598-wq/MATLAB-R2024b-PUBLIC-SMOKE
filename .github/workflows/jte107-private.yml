# W107-01 completion: selector near-zero numeric ambiguity; no prior MATLAB/oracle rerun.
name: JTE107 private stored-native mechanism breakdown
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte107-private.yml']
permissions:
  contents: read
concurrency:
  group: jte107-private
  cancel-in-progress: false
jobs:
  stored-native-mechanism:
    if: github.event.head_commit.message == 'JTE107_SELECTOR_BOUNDARY_FLAG_COMPLETION'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HDF5 reader dependencies only, no test execution
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.14.0
      - name: Existing SHA-verified arrays to private mechanism ledger
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python jte-public/JTE107_mechanismLedger.py
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte107-private
