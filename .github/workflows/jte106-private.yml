name: JTE106 read-only archived MATLAB-native core decision audit
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte106-private.yml']
permissions:
  contents: read
concurrency:
  group: jte106-private
  cancel-in-progress: false
jobs:
  native-archive-audit:
    if: github.event.head_commit.message == 'JTE106_READONLY_NATIVE_CORE_AUDIT'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual cloud ACK and verified archives only
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE106_private_io.py fetch
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Read-only source and native MAT decision audit, no simulation
        id: audit
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE106_nativeCoreAudit()
      - name: Private flags, dictionary and evidence full SHA readback
        if: ${{ always() && steps.audit.outcome != 'skipped' && steps.audit.outcome != '' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE106_private_io.py publish
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte106-private
