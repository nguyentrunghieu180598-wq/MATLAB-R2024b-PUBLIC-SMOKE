name: JTE Isolated Case Runtime B0L2400 C0600 (Encrypted)
on:
  push:
    paths:
      - '.github/workflows/jte-isolate-cases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: B0L
            horizon: 2400
          - case: C0
            horizon: 600
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public MathWorks SLX
        run: |
          git clone --branch 24.2.1.5 --depth 1 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: MATLAB R2024b + needed Simscape packages
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Simulink
            Simscape
            Simscape_Battery
            Simscape_Electrical
            Simscape_Fluids
            Stateflow
      - name: Run isolated model diagnostic
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); ci_jte_case_diagnostic('${{ matrix.case }}',${{ matrix.horizon }})
      - name: Encrypt raw numeric result before any artifact publication
        run: |
          python3 -m pip install --quiet --break-system-packages "cryptography>=42,<47"
          python3 jte-public/encrypt_results.py --source "private-diagnostics-${{ matrix.case }}" --dest "encrypted-${{ matrix.case }}" --key jte-public/JTE2026_PUBLIC_RSA_ENCRYPTION_KEY.pem --label "DIAGNOSTIC_${{ matrix.case }}_${{ matrix.horizon }}"
          rm -rf "private-diagnostics-${{ matrix.case }}" ephemeral-models
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: "jte-isolated-${{ matrix.case }}-${{ matrix.horizon }}-encrypted"
          path: "encrypted-${{ matrix.case }}/"
          retention-days: 7
          if-no-files-found: error
      - name: Verify reference unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
