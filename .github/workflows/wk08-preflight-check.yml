name: WK08 READ-ONLY preflight check - DEFAULT DISABLED
on:
  push:
    branches: ['codex/wk08-geometric-injection']
    paths: ['jte-public/WK08_PREFLIGHT_TRIGGER.txt']
permissions:
  contents: read
concurrency:
  group: wk08-readonly-preflight-20261103
  cancel-in-progress: false
jobs:
  check:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 10
    env:
      WK08_MODE: CI_5S
      WK08_PROTECTED_ENV_NAME: JTE_DRIVE_WRITE
      WK08_REVIEWED_SOURCE_SHA: '0000000000000000000000000000000000000000'
      WK08_OWNER_APPROVAL: ${{ vars.WK08_OWNER_APPROVAL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Reviewed source S then workflow-only E then marker-only T
        shell: bash
        run: |
          test "${{ github.event.head_commit.message }}" = "WK08_PREFLIGHT_CHECK_20261103"
          test "${{ github.run_attempt }}" = "1"
          test "$(git rev-parse HEAD~2)" = "$WK08_REVIEWED_SOURCE_SHA"
          test "$(git diff --name-only HEAD~2 HEAD~1)" = ".github/workflows/wk08-preflight-check.yml"
          test "$(git diff --name-only HEAD~1 HEAD)" = "jte-public/WK08_PREFLIGHT_TRIGGER.txt"
          test ! -d actuator-review-private
      - name: Read-only OAuth, ACL, quota, intents and input linkage - NO MATLAB
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/WK08_private_gate.py check
