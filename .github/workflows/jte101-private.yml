name: JTE101 Stage A actual native MAT schema audit (no simulation)
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte101-private.yml']
permissions:
  contents: read
concurrency:
  group: jte101-bounded-private
  cancel-in-progress: false
jobs:
  stage-a:
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read existing private MAT and qualify storage quota (accepted access reused)
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE101_io.py fetch-a
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Audit actual record/native/schema/state fields only
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE101_stageA
      - name: Retain actual audit in private Drive with SHA readback
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE101_io.py publish-a
      - name: Remove private scratch
        if: always()
        run: rm -rf jte101-private
