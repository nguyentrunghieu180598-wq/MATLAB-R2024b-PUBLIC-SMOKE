name: JTE091 pinned FlwR modulo boundary causal counterfactual
on:
  push:
    branches: ['chat/jte091-controller-boundary-canary-20261026']
    paths: ['jte091/TRIGGER_CANARY.txt']
permissions:
  contents: read
jobs:
  synthetic-source-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned unchanged MathWorks source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Two-branch synthetic source-specific controlled boundary test
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE091_controller_boundary_canary
      - name: No source/public MAT results; cleanup
        if: always()
        run: rm -rf jte091-generated*
