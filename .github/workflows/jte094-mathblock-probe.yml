name: JTE094 synthetic Simulink mod boundary diagnostic
on:
  push:
    branches: ['codex/jte094-evidence-quantizer']
    paths: ['.github/workflows/jte094-mathblock-probe.yml']
permissions:
  contents: read
jobs:
  simulink-operator-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE094_MathBlock_probe
