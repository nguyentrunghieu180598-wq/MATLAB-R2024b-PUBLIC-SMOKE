name: JTE069 active-reference three-site −2K MATLAB raw sensitivity
on:
  push:
    branches: [main]
    paths: ['jte069/TRIGGER_ACTIVE_G6_ONCE.txt']
permissions:
  contents: read
jobs:
  active-g6:
    if: ${{ github.repository == 'nguyentrunghieu180598-wq/MATLAB-R2024b-PUBLIC-SMOKE' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'JTE069_AUTHORIZE_ACTIVE_REFERENCE_THREE_MINUS2K_CASES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: JTE_DRIVE_WRITE
    strategy:
      fail-fast: false
      matrix:
        site: [hot,middle,cold]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin original public MathWorks module
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Native active-control reference C0 ranking and C1 physical run
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE069_active_G6_case('${{ matrix.site }}')
      - name: Private-only complete MAT upload and readback SHA check
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE_POSITION: ${{ matrix.site }}
        run: python3 jte-public/JTE069_upload_active_G6.py
      - name: Delete confidential MAT/model copies from runner
        if: always()
        run: rm -rf jte069-private jte069-generated-*
      - name: Verify source model unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
