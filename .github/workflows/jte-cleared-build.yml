name: JTE Cleared Public Model Build and Compile (No Private Data)

on:
  push:
    paths:
      - '.github/workflows/jte-cleared-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-jte:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Pin original public MathWorks model
        run: |
          git clone --branch 24.2.1.5 --depth 1 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Install MATLAB R2024b and official example dependencies
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Simulink
            Simscape
            Simscape_Battery
            Simscape_Electrical
            Simscape_Fluids
            Stateflow
      - name: Test algebra and build/compile two public-source model copies
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); ci_jte_build
      - name: Verify vendor source intact
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
      - name: Save nonconfidential gate evidence; do not publish generated SLX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jte-public-code-gates-only
          path: |
            reports/
          retention-days: 3
          if-no-files-found: warn
