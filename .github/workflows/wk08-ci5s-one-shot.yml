name: WK08 CI_5S-C 5s source design - DEFAULT DISABLED
on:
  push:
    branches: ['codex/wk08-geometric-injection']
    paths: ['jte-public/WK08_CI5S_TRIGGER.txt']
permissions:
  contents: read
concurrency:
  group: wk08-ci5s-one-shot-20261103C
  cancel-in-progress: false
jobs:
  ci5s:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 30
    env:
      WK08_MODE: CI_5S
      WK08_PROTECTED_ENV_NAME: JTE_DRIVE_WRITE
      WK08_REVIEWED_SOURCE_SHA: '0000000000000000000000000000000000000000'
      WK08_OWNER_APPROVAL: ${{ vars.WK08_OWNER_APPROVAL }}
    steps:
      - name: Reserve wall time for private delivery
        run: echo "WK08_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Reviewed source S then workflow-only E then marker-only T
        shell: bash
        run: |
          test "${{ github.event.head_commit.message }}" = "WK08_CI_5S_ONE_SHOT_20261103C"
          test "${{ github.run_attempt }}" = "1"
          test "$(git rev-parse HEAD~2)" = "$WK08_REVIEWED_SOURCE_SHA"
          test "$(git diff --name-only HEAD~2 HEAD~1)" = ".github/workflows/wk08-ci5s-one-shot.yml"
          test "$(git diff --name-only HEAD~1 HEAD)" = "jte-public/WK08_CI5S_TRIGGER.txt"
          test ! -d actuator-review-private
      - uses: actions/checkout@v4
        with:
          repository: mathworks/Battery-Pack-Model-Simscape
          ref: f98d21929a3a269dacd1ee38999cd9773760c6db
          path: vendor-pack
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024bU10
          products: Simulink Simscape Simscape_Electrical
      - name: Verify matlab-batch and its license before reserving one-shot
        shell: bash
        run: |
          command -v matlab-batch >/dev/null || { echo WK08_MATLAB_BATCH_UNAVAILABLE; exit 1; }
          # B5: license probe BEFORE the reservation. This dummy disp() carries no
          # model/simulation data (unlike the real supervised run below, which stays
          # private), so on failure its console text is safe to print for diagnosis.
          out="$(MW_BATCH_LICENSING_ONLINE=true timeout 600 matlab-batch "disp('WK08_LICENSE_OK')" 2>&1)" || true
          case "$out" in
            *WK08_LICENSE_OK*) echo WK08_LICENSE_PROBE_OK ;;
            *) echo WK08_LICENSE_PROBE_FAILED
               echo "--- probe console (first 4000 chars; dummy command only, no model/run data) ---"
               printf '%s\n' "$out" | head -c 4000
               echo
               exit 1 ;;
          esac
      - name: Private source SHA and durable one-attempt reservation
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/WK08_private_gate.py prepare
      - name: ONE supervised MATLAB process, no retry
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/WK08_supervise.py
      - name: Private full-byte receipt including failure diagnostics
        if: ${{ always() }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        shell: bash
        run: |
          if test -d actuator-review-private; then
            python3 jte-public/WK08_private_gate.py publish
          fi
      - name: Cleanup after complete private readback only
        if: ${{ always() }}
        shell: bash
        run: |
          if test -f actuator-review-private/WK08_DELIVERY_VERIFIED; then
            rm -rf actuator-review-private
          fi
