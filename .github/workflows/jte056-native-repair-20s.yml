name: JTE056 native logger repair 20s encrypted validation
on:
  push:
    branches: ['jte056/native-logger-20261025']
    paths: ['jte056/TRIGGER_REPAIR_20S.txt']
permissions:
  contents: read
jobs:
  repair20:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify authorized recipient
        run: echo '912e83932ab6a0463934580615a0944399eacd0a0d829ffa1c59a9b840f2c6c5  jte-public/JTE052_PUBLIC_RSA.pem' | sha256sum -c -
      - name: Pin official source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Fixture then actual logger repair validation
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE056_repair_20s
      - name: Encrypt private repair MAT
        run: |
          python3 -m pip install --quiet 'cryptography>=42,<51'
          python3 jte-public/encrypt_results.py --source jte056-private --dest jte056-encrypted --key jte-public/JTE052_PUBLIC_RSA.pem --label JTE056_LOGGER_REPAIR_20S_NOT_G5
          test -s jte056-encrypted/encrypted-results.bin
          test -s jte056-encrypted/envelope.json
      - name: Remove private plaintext before artifact upload
        if: always()
        run: rm -rf jte056-private jte056-generated
      - uses: actions/upload-artifact@v4
        with:
          name: jte056-native-logger-repair20-ciphertext
          path: jte056-encrypted/
          retention-days: 3
          if-no-files-found: error
      - name: Verify vendor source unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
