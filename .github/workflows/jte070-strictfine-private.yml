name: JTE070 strict solver fine original-physics G5 numerical audit
on:
  push:
    branches: [main]
    paths: ['jte070/TRIGGER_STRICT_FINE_ONCE.txt']
permissions:
  contents: read
jobs:
  strict-fine:
    if: ${{ github.repository == 'nguyentrunghieu180598-wq/MATLAB-R2024b-PUBLIC-SMOKE' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'JTE070_AUTHORIZE_STRICT_FINE_B0L_C0_2400S' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: JTE_DRIVE_WRITE
    strategy:
      fail-fast: false
      matrix:
        case: [B0L,C0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin unchanged MathWorks source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Run strict numerical refinement 2400s MATLAB native
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE070_strictfine_case('${{ matrix.case }}')
      - name: Save raw MAT directly in owner-private Drive, verify byte SHA
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE_CASE: ${{ matrix.case }}
        run: python3 jte-public/JTE070_upload_strictfine.py
      - name: Remove private output and derivative
        if: always()
        run: rm -rf jte070-private jte070-generated-*
      - name: Verify source unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
