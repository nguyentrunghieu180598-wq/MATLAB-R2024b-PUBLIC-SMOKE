name: JTE056 MATLAB R2024b native logger fixture selftest
on:
  push:
    branches: ['jte056/native-logger-20261025']
    paths: ['jte056/TRIGGER_SELFTEST.txt']
permissions:
  contents: read
jobs:
  native-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest
