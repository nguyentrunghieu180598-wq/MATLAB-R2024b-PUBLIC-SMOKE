name: JTE108 one private critical-bias audit
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte108-private.yml']
permissions:
  contents: read
concurrency:
  group: jte108-private
  cancel-in-progress: false
jobs:
  native-critical-bias:
    if: github.event.head_commit.message == 'JTE108_ONE_READONLY_CRITICAL_BIAS_AUDIT'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HDF5 numeric reader only, no test suite
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 h5py==3.14.0
      - name: One read-only native critical-bias audit and private SHA readback
        env:
          PYTHONUNBUFFERED: '1'
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python jte-public/JTE108_criticalBias.py
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte108-private
