name: JTE094 original-law atomic B0L 340s counterfactual
on:
  push:
    branches: ['codex/jte094-evidence-quantizer']
    paths: ['.github/workflows/jte094-atomic-full340.yml']
concurrency:
  group: jte094-atomic-full340
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  atomic-full340-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin unchanged source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: New atomic quantization counterfactual only (not JTE092 replay)
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE094_atomicFullPlant
      - name: Remove derivative scratch, no public research artifacts
        if: always()
        run: rm -rf jte094-generated

# q logging branches at the containing subsystem boundary (no cross-hierarchy line).

# Exclude display-only Scope dialog getters from the physical-parameter audit.

# Validate signed source connectivity independent of Sum icon spacer and port ordering.
