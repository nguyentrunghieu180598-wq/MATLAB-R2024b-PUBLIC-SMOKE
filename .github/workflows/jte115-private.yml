name: JTE115 corrected canary receipt ONLY plant disabled
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte115-private.yml']
permissions:
  contents: read
concurrency:
  group: jte115-one-attempt
  cancel-in-progress: false
jobs:
  corrected-canary-no-plant:
    if: github.event.head_commit.message == 'JTE115_ASSERT_DIAGNOSTIC_ONLY'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax check private transport
        run: python3 -m py_compile jte-public/JTE115_privateIO.py
      - name: Verify failed canary receipt and no plant intent
        id: fetch
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE115_privateIO.py fetch
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        id: setup
        with:
          release: R2024b
      - name: Corrected pure MATLAB canary only no model load compile or simulation
        id: canary
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE115_canaryOnly()
      - name: Private synthetic receipt flags and console full SHA readback
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE115_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          JTE115_STEP_OUTCOME: ${{ steps.canary.outcome }}
        run: python3 jte-public/JTE115_privateIO.py publish-prepare
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte115-private
