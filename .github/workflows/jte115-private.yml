name: JTE115 one source-equivalent guard diagnostic
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte115-private.yml']
permissions:
  contents: read
concurrency:
  group: jte115-one-attempt
  cancel-in-progress: false
jobs:
  one-guard-study:
    if: github.event.head_commit.message == 'JTE115_ONE_GUARDED_ODE23T340'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax check transport only
        run: python3 -m py_compile jte-public/JTE115_privateIO.py
      - name: Reuse verified source comparator, private readback and current free resources
        id: fetch
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE115_privateIO.py fetch
      - name: Pinned untouched public source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        id: setup
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: One MATLAB bitwise canary then static clone and compile only
        id: prepare
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE115_entry('prepare')
      - name: Private preparation SHA readback before any study
        id: deliver_prepare
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE115_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          JTE115_STEP_OUTCOME: ${{ steps.prepare.outcome }}
        run: python3 jte-public/JTE115_privateIO.py publish-prepare
      - name: Reserve only after canary, static proof and private delivery pass
        id: gate
        if: ${{ success() && steps.prepare.outcome == 'success' && steps.deliver_prepare.outcome == 'success' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE115_privateIO.py gate
      - name: Exactly one new guarded original ode23t 0-340 study
        id: study
        if: ${{ success() && steps.gate.outputs.may_run == 'true' }}
        timeout-minutes: 15
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE115_entry('simulate')
      - name: Private raw, flags and console full SHA readback
        if: ${{ always() && steps.gate.outputs.may_run == 'true' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE115_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          JTE115_STEP_OUTCOME: ${{ steps.study.outcome }}
        run: python3 jte-public/JTE115_privateIO.py publish-study
      - name: Preserve vendor pin
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte115-private
