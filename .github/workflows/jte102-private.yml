name: JTE102 private audit and named-signal-preserving equivalent filter
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte102-private.yml']
permissions:
  contents: read
concurrency:
  group: jte102-private
  cancel-in-progress: false
jobs:
  existing-data-audit:
    if: github.event.head_commit.message == 'JTE102_PRIVATE_EXISTING_MAT_AUDIT'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet 'numpy==2.2.6' 'h5py==3.14.0'
      - name: Test native metrics on synthetic fixtures only
        run: python3 -m unittest discover -s jte-public -p test_JTE102_metrics.py -v
      - name: Fetch already accepted private assets (no preflight)
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE102_private_io.py fetch
      - name: Audit six existing MAT and write private metrics
        run: python3 jte-public/JTE102_metrics.py
      - name: Private metrics full SHA readback
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE102_private_io.py publish
      - name: Delete private runner scratch
        if: always()
        run: rm -rf jte102-private
  equivalent-realization:
    if: github.event.head_commit.message == 'JTE102_ONE_EQUIVALENT_STATE_SPACE_340'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch accepted Stage A and original340 (no rerun)
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE102_private_io.py fetch-b
      - name: Pin untouched vendor
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: New realization canary, source near-ULP law and sole-node proof
        id: prepare
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE102_stateSpace('prepare')
      - name: Preserve canary or rejected static diff before physical run
        if: ${{ always() && steps.prepare.outcome != 'skipped' && steps.prepare.outcome != '' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE102_private_io.py publish-prepare
      - name: One conditional physical intent
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE102_private_io.py intent-b
      - name: One new State-Space full-plant340, original reference reused
        id: candidate
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE102_stateSpace('simulate')
      - name: Preserve raw candidate and outcome privately
        if: ${{ always() && steps.candidate.outcome != 'skipped' && steps.candidate.outcome != '' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE102_private_io.py publish-full
      - name: Delete private runner scratch
        if: always()
        run: rm -rf jte102-private jte102-generated
      - name: Vendor unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
