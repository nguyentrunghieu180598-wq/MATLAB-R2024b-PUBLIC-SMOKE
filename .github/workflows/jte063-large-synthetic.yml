name: JTE063 synthetic only 20MiB private Drive chunked test
on:
  push:
    branches: [main]
    paths:
      - 'jte063/TRIGGER_20MIB_ONCE.txt'
permissions:
  contents: read
jobs:
  large-synthetic:
    if: ${{ github.repository == 'nguyentrunghieu180598-wq/MATLAB-R2024b-PUBLIC-SMOKE' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'JTE063_RUN_ONCE_OWNER_APPROVED_SYNTHETIC_20MIB' }}
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Transfer only 20 MiB deterministic synthetic bytes to private Drive
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE063_large_synthetic_20mb.py
