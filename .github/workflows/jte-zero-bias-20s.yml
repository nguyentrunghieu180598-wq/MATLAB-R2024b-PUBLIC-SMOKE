name: JTE B0L C0 20s CI Gate (No Research Data Upload)

on:
  push:
    paths:
      - '.github/workflows/jte-zero-bias-20s.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g4-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Obtain pinned public MathWorks model
        run: |
          git clone --branch 24.2.1.5 --depth 1 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Install MATLAB R2024b licensed test products
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Simulink
            Simscape
            Simscape_Battery
            Simscape_Electrical
            Simscape_Fluids
            Stateflow
      - name: Run B0L/C0 paired smoke 20s; do NOT upload MAT or CSV
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); ci_jte_paired_smoke
      - name: Verify original pinned model unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
