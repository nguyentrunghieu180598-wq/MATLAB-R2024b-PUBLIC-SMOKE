name: JTE058 synthetic numerical and event semantics fixtures
on:
  push:
    branches: ['work/jte058-technical-gates-20261025']
    paths: ['jte058/TRIGGER_SYNTHETIC_FIXTURES.txt']
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python synthetic tests only
        run: |
          python3 -m pip install --quiet numpy
          cd jte-public
          python3 -m unittest -v test_JTE058_native_math test_JTE058_review
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink
      - name: MATLAB adversarial and tiny synthetic Simulink fixtures only
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE058syntheticFixtures
