name: JTE087 minimal zero-cross impact R2024b source-only event diagnostic
on:
  push:
    branches: ['chat/jte087-minzc-impact-20261026']
    paths: ['jte087/TRIGGER_MINZC.txt']
permissions:
  contents: read
jobs:
  source-minimal-zc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin unchanged MathWorks source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Native 340s source-locked minimal zero-crossing impact
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE087_minzc_impact340('minzc340')
      - name: Cleanup
        if: always()
        run: rm -rf jte087-generated-*