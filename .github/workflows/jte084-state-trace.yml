name: JTE084 real R2024b source-locked TransferFcn continuous-state root-cause
on:
  push:
    branches: ['chat/jte084-native-tf-state-rootcause-20261026']
    paths: ['jte084/TRIGGER_NATIVE_STATE.txt']
permissions:
  contents: read
jobs:
  native-state:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin identical untouched vendor source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: First event TF xout state versus native input-output (no secret, no published values)
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE084_tf_state_probe
      - name: Destroy all generated and native state traces
        if: always()
        run: rm -rf jte084-generated* jte084-private*