name: JTE103 one gated source profiler340 with private session retention
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte103-private.yml']
permissions:
  contents: read
concurrency:
  group: jte103-private
  cancel-in-progress: false
jobs:
  capability:
    if: github.event.head_commit.message == 'JTE103_PROFILER_CAPABILITY_AND_READONLY_G6_AUDIT'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual cloud ACK and private input inventory, not an access preflight
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py fetch-cap-api
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink
      - name: Actual R2024b API, short canary if needed, and stored G6 audit
        id: cap
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE103_capability('capture')
      - name: Preserve actual capability or failure proof privately
        if: ${{ always() && steps.cap.outcome != 'skipped' && steps.cap.outcome != '' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py publish-cap
      - name: Download verified session copy
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py readback-canary
      - name: Session readback via supported MAT inventory and public explorer if GUI exists
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE103_capability('readback')
      - name: Preserve readback receipt
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py publish-readback
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte103-private
  source-profile:
    if: github.event.head_commit.message == 'JTE103_ONE_SOURCE_PROFILER340'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 35
    env:
      JTE103_CAP_RUN: '40475302766'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse actual profiler and private readback proof, source archives
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py fetch-source
      - name: Pin untouched vendor
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: One owner-authorized source profiler intent
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py intent-source
      - name: Exactly one unchanged-source0to340 profile using public R2024b API
        id: profile
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE103_sourceProfile('capture')
      - name: Preserve session, public summary, native output or failure provenance privately
        if: ${{ always() && steps.profile.outcome != 'skipped' && steps.profile.outcome != '' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py publish-source
      - name: Download saved source session again
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py source-readback
      - name: Supported MAT inventory and public explorer only
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE103_sourceProfile('readback')
      - name: Private source retention receipt
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py publish-source-readback
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte103-private jte103-generated
      - name: Vendor remains unchanged
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
