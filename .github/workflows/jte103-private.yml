name: JTE103 profiler capability and read-only G6 deviation audit
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte103-private.yml']
permissions:
  contents: read
concurrency:
  group: jte103-private
  cancel-in-progress: false
jobs:
  capability:
    if: github.event.head_commit.message == 'JTE103_PROFILER_CAPABILITY_AND_READONLY_G6_AUDIT'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual cloud ACK and private input inventory, not an access preflight
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py fetch-cap
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink
      - name: Actual R2024b API, short canary if needed, and stored G6 audit
        id: cap
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE103_capability('capture')
      - name: Preserve actual capability or failure proof privately
        if: ${{ always() && steps.cap.outcome != 'skipped' && steps.cap.outcome != '' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py publish-cap
      - name: Download verified session copy
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py readback-canary
      - name: Session readback via supported MAT inventory and public explorer if GUI exists
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE103_capability('readback')
      - name: Preserve readback receipt
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE103_private_io.py publish-readback
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte103-private
