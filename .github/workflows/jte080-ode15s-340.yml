name: JTE080 independent stiff ode15s 340s first-event source diagnostic
on:
  push:
    branches: ['chat/jte080-ode15s-stiff-340s-probe-20261026']
    paths: ['jte080/TRIGGER_340S.txt']
permissions:
  contents: read
jobs:
  independent-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm immutable upstream MATLAB model
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Independent stiff solver experiment only (no study MAT)
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE080_ode15s_reference340('ode15s_340')
      - name: Cleanup
        if: always()
        run: rm -rf jte080-generated-* 
