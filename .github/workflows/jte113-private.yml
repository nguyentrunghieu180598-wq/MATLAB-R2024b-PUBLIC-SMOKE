name: JTE113 one gated source ode23tb005 discriminator
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/jte113-private.yml']
permissions:
  contents: read
concurrency:
  group: jte113-one-attempt
  cancel-in-progress: false
jobs:
  one-gated-discriminator:
    if: github.event.head_commit.message == 'JTE113_ONE_GATED_ODE23TB005_340'
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Current free eligibility, verified old source and private sink
        id: fetch
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE113_privateIO.py fetch
      - name: Pinned untouched public source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        id: setup
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Reserve the one conditional attempt, never automatic retry
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/JTE113_privateIO.py reserve
      - name: Current license and initialized resource checks, then at most one candidate
        id: candidate
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE113_entry()
      - name: Full private raw, console and flags SHA readback
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE113_CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          JTE113_SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: python3 jte-public/JTE113_privateIO.py publish
      - name: Preserve vendor pin
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
      - name: Remove private runner scratch
        if: always()
        run: rm -rf jte113-private
