name: M3 tiny logger API qualification NO BATTERY
on:
  push:
    branches: [codex/jte-tf-constant-input]
    paths: [.github/workflows/m3-logger-probe.yml]
permissions:
  contents: read
concurrency:
  group: m3-logger-infrastructure
  cancel-in-progress: false
jobs:
  logger-probe:
    if: github.event.head_commit.message == 'M3_QUALIFY_TINY_LOGGER_API_NO_BATTERY' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private sink
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python jte-public/m3_logger_io.py prepare
      - name: Official HTTPS mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink
      - name: ONE tiny synthetic infrastructure trajectory
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); BTMS_M3_loggerProbe()
      - name: Preserve all private infrastructure evidence
        if: always()
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python jte-public/m3_logger_io.py publish
      - name: Cleanup
        if: always()
        run: rm -rf actuator-review-private
