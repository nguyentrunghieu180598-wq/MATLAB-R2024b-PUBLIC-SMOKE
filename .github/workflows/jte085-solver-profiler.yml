name: JTE085 real R2024b source-locked solver event profile (private scratch)
on:
  push:
    branches: ['chat/jte085-solver-profiler-event-20261026']
    paths: ['jte085/TRIGGER_PROFILER.txt']
permissions:
  contents: read
jobs:
  solver-profiler:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin immutable vendor model
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: MathWorks Solver Profiler private native zero-crossing and reset trace
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE085_solver_event_audit
      - name: Delete all solver profiler files and raw data after CI
        if: always()
        run: rm -rf jte085-private jte085-generated