name: JTE034 synthetic MATLAB math tests
on:
  push:
    branches: ['codex/jte034-math-integration']
    paths: ['.github/workflows/jte034-selftest.yml']
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - name: Original JTE034 selftest
        uses: matlab-actions/run-command@v3
        with:
          command: assert(strcmp(version('-release'),'2024b')); addpath('jte-public'); diary('JTE034_original_selftest.log'); JTE034_selftest; diary off
      - name: Crossing command regression
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); diary('JTE034_crossing.log'); JTE034_crossing_test; diary off
      - name: Fail-closed diagnostic regression
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); diary('JTE034_failure_boundary.log'); JTE034_failure_boundary_test; diary off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jte034-synthetic-test-logs
          path: JTE034*.log
          retention-days: 30
          if-no-files-found: warn
