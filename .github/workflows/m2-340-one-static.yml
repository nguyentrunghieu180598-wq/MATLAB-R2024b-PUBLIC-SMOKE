name: BTMS M2 340 ONE B0L10ms STATIC COMPILE ONLY
on:
  push:
    branches: ['codex/jte-tf-constant-input']
    paths: ['.github/workflows/m2-340-one-static.yml']
permissions:
  contents: read
concurrency:
  group: btms-m2-340-one-static
  cancel-in-progress: false
jobs:
  compile-new-logger-only:
    if: ${{ false }} # Qualifying one-model compile complete; owner physical approval required.
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private approved SLX and existing receipts ONLY
        id: fetch
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: |
          python3 -m py_compile jte-public/m2340_io.py
          python3 jte-public/m2340_io.py fetch
      - name: Exact vendor for compiled library no source edit
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - name: Official HTTPS dependency mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Prepare ONE 340s clone COMPILE ONLY no sim initialize step
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); BTMS_M2_340_compileEntry()
      - name: Private source parity resource evidence full SHA readback
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/m2340_io.py publish
      - name: Immutable vendor pin
        if: always()
        run: |
          if [ -f vendor-pack/Models/Battery_Pack_Thermal_Management.slx ]; then
            echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
          fi
      - name: Remove private Cloud scratch
        if: always()
        run: rm -rf actuator-review-private

# Prior invocation stopped before copy/compile: supply mandatory receipt SHA argument.

# Pin has StartTime=0.0: require numeric zero, preserve exact source configuration text.

# Preserve raw evidence before deep audit; normalize only actual Filename spelling.

# Nominal graph inventory must explicitly include commented observers; cancel superseded own setup.

# Compare canonical audit string against equally normalized expected path; raw get_param path is also exact.
