name: JTE096 selective-wire hotfix static unit and compile
on:
  push:
    branches: ['codex/jte096-hotfix']
    paths: ['.github/workflows/jte096-hotfix.yml']
permissions:
  contents: read
concurrency:
  group: jte096-hotfix
  cancel-in-progress: true
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin unchanged vendor
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Reuse already-passed cleanup and routing unit evidence
        run: echo 'JTE096_NEW_UNIT_PASS reused from run 40369074541 at 4d8d2f09c6a7091e1355c4b8e2ef52512167ba39; not rerun'
      - name: Independently loaded pristine B0L and derivative static audit plus compile
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE094_atomicFullPlant('compileOnly')
      - name: Remove compile-only scratch, never publish MAT
        if: always()
        run: rm -rf jte094-generated
