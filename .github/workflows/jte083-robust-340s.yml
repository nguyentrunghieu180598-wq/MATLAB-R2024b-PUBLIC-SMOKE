name: JTE083 source-pinned ode23t robust solver-reset 340s event diagnostic
on:
  push:
    branches: ['chat/jte083-solver-reset-robust-340s-20261026']
    paths: ['jte083/TRIGGER_SOURCE_340S.txt']
permissions:
  contents: read
jobs:
  reset-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin official source
        run: |
          git clone --depth 1 --branch 24.2.1.5 https://github.com/mathworks/Battery-Pack-Model-Simscape.git vendor-pack
          test "$(git -C vendor-pack rev-parse HEAD)" = "f98d21929a3a269dacd1ee38999cd9773760c6db"
          echo '0a61b958173e55f9a5683d8f91fc82dc00078d6a948b66c23883b370bbc4abc0  vendor-pack/Models/Battery_Pack_Thermal_Management.slx' | sha256sum -c -
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: Controlled Robust reset original ode23t 340s diagnostic
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('jte-public'); JTE056selftest; JTE083_reset_robust340('robust340')
      - name: Cleanup confidential local-only scratch
        if: always()
        run: rm -rf jte083-generated-*
