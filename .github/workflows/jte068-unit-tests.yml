name: JTE068 no-secret alternate-ambient preflight guards
on:
  push:
    branches: ['chat/jte068-active-regime-ambient-20261026']
    paths: ['jte068/TRIGGER_UNIT_TESTS.txt']
permissions:
  contents: read
jobs:
  no-study-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No-secret alternate-ambient permission and stream checks
        run: |
          cd jte-public
          python3 -m unittest -v test_JTE063_streaming_drive test_JTE068_gate
