name: WK10 D13 k=2 340s source design - DEFAULT DISABLED
on:
  push:
    branches: ['codex/wk10-d13-k2-340']
    paths: ['jte-public/WK10_D13_REF_K2_T340_A_TRIGGER.txt']
permissions:
  contents: read
concurrency:
  group: wk10-d13-ref-k2-t340-a-20261103
  cancel-in-progress: false
jobs:
  d13:
    if: ${{ true }}
    runs-on: ubuntu-latest
    environment: JTE_DRIVE_WRITE
    timeout-minutes: 35
    env:
      WK08_MODE: D13_REF
      WK08_PROTECTED_ENV_NAME: JTE_DRIVE_WRITE
      WK08_REVIEWED_SOURCE_SHA: 'e96ed4c7439db3b146539aab6f8fabb6aea32633'
      WK08_OWNER_APPROVAL: ${{ vars.WK08_OWNER_APPROVAL }}
    steps:
      - name: Reserve wall time for private delivery
        run: echo "WK08_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Reviewed source S then workflow-only E then marker-only T
        shell: bash
        run: |
          test "${{ github.event.head_commit.message }}" = "WK10_D13_REF_K2_T340_A_ONE_SHOT_20261103"
          test "${{ github.run_attempt }}" = "1"
          test "$(git rev-parse HEAD~2)" = "$WK08_REVIEWED_SOURCE_SHA"
          test "$(git diff --name-only HEAD~2 HEAD~1)" = ".github/workflows/wk10-d13-ref-one-shot.yml"
          test "$(git diff --name-only HEAD~1 HEAD)" = "jte-public/WK10_D13_REF_K2_T340_A_TRIGGER.txt"
          test ! -d actuator-review-private
      - uses: actions/checkout@v4
        with:
          repository: mathworks/Battery-Pack-Model-Simscape
          ref: f98d21929a3a269dacd1ee38999cd9773760c6db
          path: vendor-pack
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024bU10
          products: Simulink Simscape Simscape_Battery Simscape_Electrical Simscape_Fluids Stateflow
      - name: License probe through run-command (WK07 path, dummy command, before reservation)
        uses: matlab-actions/run-command@v3
        with:
          command: disp('WK08_LICENSE_OK')
          generate-summary: false
      - name: Resolve the run-matlab-command binary used by the supervisor
        shell: bash
        run: |
          bin="$(find "$(dirname "$RUNNER_WORKSPACE")/_actions/matlab-actions/run-command" -path '*/dist/bin/glnxa64/run-matlab-command' -type f 2>/dev/null | head -n1)"
          test -n "$bin" || { echo WK08_MATLAB_BATCH_UNAVAILABLE; exit 1; }
          chmod +x "$bin"
          test -x "$bin" || { echo WK08_MATLAB_BATCH_UNAVAILABLE; exit 1; }
          echo "WK08_RUN_MATLAB_COMMAND=$bin" >> "$GITHUB_ENV"
          echo WK08_LAUNCHER_RESOLVED
      - name: Private source SHA and durable one-attempt reservation
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/WK08_private_gate.py prepare
      - name: ONE supervised MATLAB process, no retry
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        run: python3 jte-public/WK08_supervise.py
      - name: Private full-byte receipt including failure diagnostics
        if: ${{ always() }}
        env:
          JTE_GOOGLE_CLIENT_ID: ${{ secrets.JTE_GOOGLE_CLIENT_ID }}
          JTE_GOOGLE_CLIENT_SECRET: ${{ secrets.JTE_GOOGLE_CLIENT_SECRET }}
          JTE_GOOGLE_REFRESH_TOKEN: ${{ secrets.JTE_GOOGLE_REFRESH_TOKEN }}
        shell: bash
        run: |
          if test -d actuator-review-private; then
            python3 jte-public/WK08_private_gate.py publish
          fi
      - name: Cleanup after complete private readback only
        if: ${{ always() }}
        shell: bash
        run: |
          if test -f actuator-review-private/WK08_DELIVERY_VERIFIED; then
            rm -rf actuator-review-private
          fi
